name: Research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: make unit PYTHON=python
      - name: Integration tests
        run: make integration PYTHON=python
      - name: Verify frozen benchmark evidence
        run: make audit PYTHON=python
      - name: Build benchmark page
        run: make benchmark-page PYTHON=python
